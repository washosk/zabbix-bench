name: Build & Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests with race detector
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.out
          retention-days: 7

      - name: Check Go formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go files not formatted:"
            gofmt -s -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run go mod tidy
        run: |
          go mod tidy
          git diff --exit-code

  build:
    runs-on: ${{ matrix.os }}
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: zabbix-bench
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: zabbix-bench
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: zabbix-bench
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: zabbix-bench
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: zabbix-bench.exe

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -o dist/${{ matrix.output }} main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zabbix-bench-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.output }}
          retention-days: 7
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifact structure
        shell: bash
        run: |
          mkdir -p release
          for dir in dist/zabbix-bench-*/; do
            artifact_name=$(basename "$dir")
            file=$(find "$dir" -type f | head -1)
            if [[ "$file" == *.exe ]]; then
              cp "$file" "release/${artifact_name}.exe"
            else
              cp "$file" "release/${artifact_name}"
            fi
          done
          ls -la release/

      - name: Create checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          draft: false
          prerelease: false
